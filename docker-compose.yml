services:
  awtrix-spotify:
    build: .
    container_name: awtrix-spotify
    restart: unless-stopped
    ports:
      # With BRIDGE_BIND_IP set, publish only on that address and loopback. Unset, publish on all.
      - "${BRIDGE_BIND_IP:-0.0.0.0}:${PORT:-8765}:${PORT:-8765}"
      - "${BRIDGE_BIND_IP:+127.0.0.1:}${PORT:-8765}:${PORT:-8765}"
    env_file:
      - .env
    volumes:
      - awtrix_spotify_data:/app/data

volumes:
  awtrix_spotify_data:
